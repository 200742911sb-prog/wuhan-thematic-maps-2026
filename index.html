<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>武汉多图层专题地图</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    header {
      padding: 32px 36px 24px;
      background: #0f172a;
      color: white;
    }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: #cbd5e1; }
    main { max-width: 1400px; margin: auto; padding: 28px 36px 52px; }
    h2 { margin: 30px 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .card img { width: 100%; display: block; background: #e2e8f0; }
    .card div { padding: 14px 16px 16px; }
    .card h3 { margin: 0 0 8px; font-size: 17px; }
    .card p { margin: 0 0 12px; color: #475569; font-size: 13px; }
    a { color: #1d4ed8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>武汉多图层专题地图</h1>
    <p>GeoLibre / QGIS / ArcGIS Pro 多源制图成果</p>
  </header>
  <main>
    <div class="grid">
      <article class="card">
        <img src="w1_location.png" alt="武汉区位与行政区划">
        <div>
          <h3>W1 武汉区位与行政区划</h3>
          <p>市域、13 区、水系与湖北省区位插图。</p>
          <a href="w1_location.pdf">打开 PDF</a>
        </div>
      </article>
      <article class="card">
        <img src="w2_terrain_water.png" alt="武汉地形与水系">
        <div>
          <h3>W2 武汉地形与水系</h3>
          <p>DEM、山体阴影、湖泊与主要河流。</p>
          <a href="w2_terrain_water.pdf">打开 PDF</a>
        </div>
      </article>
      <article class="card">
        <img src="w3_development.png" alt="武汉交通与居民地开发强度">
        <div>
          <h3>W3 武汉交通与居民地开发强度</h3>
          <p>连续平滑开发强度面，叠加道路、铁路与居民地。</p>
          <a href="w3_development.pdf">打开 PDF</a>
        </div>
      </article>
      <article class="card">
        <img src="w4_cholera_1932.png" alt="1932 武汉霍乱疫情与防疫设施">
        <div>
          <h3>W4 1932 武汉霍乱疫情与防疫设施</h3>
          <p>历史设施、警署、位置不确定性缓冲与时序。</p>
          <a href="w4_cholera_1932.pdf">打开 PDF</a>
        </div>
      </article>
      <article class="card">
        <img src="w5_data_quality.png" alt="武汉制图数据覆盖与质量核查">
        <div>
          <h3>W5 数据覆盖与质量核查</h3>
          <p>天地图 1:25 万 DLG 六幅范围与接边检查。</p>
          <a href="w5_data_quality.pdf">打开 PDF</a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
